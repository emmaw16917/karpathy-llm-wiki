[project]
name = "llm-wiki"
version = "0.1.0"
description = "LLM-maintained personal knowledge base skill, forked from karpathy-llm-wiki"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
llm-wiki-extract = "llm_wiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]
